services:
  - type: web
    name: astrava-private-beta
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
